services:
  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: muffato-mlflow-governance:1.0
    container_name: muffato-mlflow-governance
    restart: unless-stopped
    ports:
      - "5050:5000"
    volumes:
      - ./mlflow_tracking:/mlflow
      - ./reports:/app/reports
      - ./governanca:/app/governanca
      - ./config:/app/config
      - ./pipeline:/app/pipeline
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlflow/mlartifacts
      --serve-artifacts
      --allowed-hosts "*"
